<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphenlabor – Kürzeste Wege und Spannbäume</title>
  <style>
    :root {
      font: 16px/1.5 system-ui, sans-serif;
      color: #182e2c;
      background: #eef5f1;
      --accent: #075f51;
      --border: #bacfc5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 74rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    h1 { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.045em; margin: 0; }
    h2 { margin: 0 0 .6rem; font-size: 1.3rem; }
    p { margin: .4rem 0 .8rem; }
    nav, .bar { display: flex; flex-wrap: wrap; gap: .45rem; margin: .7rem 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1rem; }

    section {
      min-width: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
    }

    button, select, textarea { font: inherit; color: inherit; }
    button, select {
      max-width: 100%;
      border: 1px solid #77998e;
      border-radius: .45rem;
      background: white;
      padding: .4rem .65rem;
    }

    button { cursor: pointer; }
    button:hover { background: #e5f1ea; }
    button[aria-pressed="true"], .primary { background: var(--accent); color: white; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #9e4a00; outline-offset: 3px; }

    #canvas {
      position: relative;
      aspect-ratio: 640 / 420;
      min-height: 16rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: .65rem;
      background: radial-gradient(#abc4bb 1px, transparent 1px) #f2f8f4;
      background-size: 16px 16px;
    }

    #canvas.placing { cursor: crosshair; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    line { stroke: #647f76; stroke-width: 2; vector-effect: non-scaling-stroke; }
    line.trial { stroke: #2254a0; stroke-width: 4; }
    line.route { stroke: var(--accent); stroke-width: 5; }
    line.cycle { stroke: #a34412; stroke-width: 4; stroke-dasharray: 7 4; }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 2.35rem;
      height: 2.35rem;
      padding: 0;
      border: 2px solid #35645b;
      border-radius: 50%;
      font-weight: 750;
      touch-action: manipulation;
    }

    .node.start { border-width: 4px; }
    .node.goal { border-style: dashed; }
    .node.visited { background: var(--accent); color: white; }
    .node.component { box-shadow: inset 0 0 0 3px var(--component); }
    .node.selected, .node.current { outline: 3px solid #9e4a00; outline-offset: 2px; }
    .details, #feedback { padding: .55rem .75rem; border-radius: .5rem; background: #edf5f2; overflow-wrap: anywhere; }

    label { display: block; font-weight: 650; margin: .7rem 0 .25rem; }
    textarea { width: 100%; min-height: 7rem; resize: vertical; padding: .6rem; border: 1px solid #77998e; border-radius: .45rem; }
    ol { padding-left: 1.4rem; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Graphenlabor</h1>
  <p>Erforscht kürzeste Wege und Spannbäume. Wechselt euch beim Bedienen ab und besprecht eure Entscheidungen.</p>

  <nav aria-label="Lernaufgaben">
    <button data-task="paths">Wege vergleichen</button>
    <button data-task="trials">Kanten untersuchen</button>
    <button data-task="trees">Spannbäume bauen</button>
  </nav>

  <div class="layout">
    <section aria-labelledby="graph-title">
      <h2 id="graph-title">Graph bearbeiten</h2>
      <div class="bar" aria-label="Werkzeuge">
        <button data-mode="walk">Weg wählen</button>
        <button data-mode="add">Knoten setzen</button>
        <button data-mode="move">Knoten verschieben</button>
        <button data-mode="connect">Kante setzen</button>
        <button data-mode="cut">Kante entfernen</button>
        <button data-mode="delete">Knoten entfernen</button>
        <button data-mode="start">Start wählen</button>
        <button data-mode="goal">Ziel wählen</button>
      </div>

      <p id="hint"></p>
      <div id="canvas" role="group" aria-label="Zeichenfläche für den Graphen">
        <svg viewBox="0 0 640 420" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <p class="details" id="summary"></p>

      <div class="bar">
        <button id="undo">Rückgängig</button>
        <button id="baseline">Ausgangsgraph speichern</button>
        <button id="restore">Ausgangsgraph laden</button>
        <button id="example">Beispielgraph laden</button>
        <button id="empty">Leeren Graphen öffnen</button>
      </div>

      <div class="bar" aria-label="Analysewerkzeuge">
        <button id="distance">Kürzeste Weglänge</button>
        <button id="components" aria-pressed="false">Komponenten markieren</button>
        <button id="cycle" aria-pressed="false">Kreis hervorheben</button>
      </div>

      <p id="feedback" role="status"></p>
    </section>

    <section aria-labelledby="task-title">
      <h2 id="task-title"></h2>
      <p id="instructions"></p>

      <div id="paths">
        <div class="bar">
          <button id="new-path">Neuer Weg</button>
          <button id="check-path">Weg prüfen</button>
          <button id="save-path" class="primary">Weg merken</button>
        </div>
        <ol id="path-results" aria-label="Gemerkte Wege"></ol>
        <p id="comparison"></p>
      </div>

      <div id="trials" hidden>
        <p id="candidate"></p>
        <label for="guess">Eure Vermutung</label>
        <select id="guess">
          <option value="">Bitte wählen</option>
          <option value="shorter">Der kürzeste Weg wird kürzer.</option>
          <option value="same">Die Weglänge bleibt gleich.</option>
        </select>
        <div class="bar">
          <button id="predict">Versuch vorbereiten</button>
          <button id="test" class="primary">Kante einfügen und testen</button>
        </div>
        <ol id="trial-results" aria-label="Kantenversuche"></ol>
      </div>

      <div id="trees" hidden>
        <div class="bar">
          <button id="save-tree" class="primary">Spannbaum prüfen und merken</button>
        </div>
        <ol id="tree-results" aria-label="Gemerkte Spannbäume"></ol>
      </div>

      <label for="notes">Versuchsprotokoll</label>
      <textarea id="notes"></textarea>
      <div class="bar"><button id="download">Protokoll herunterladen</button></div>
      <p><small>Die Notizen bleiben beim Wechsel zwischen den Aufgaben erhalten. Ladet das Protokoll vor dem Schließen der Seite herunter.</small></p>
    </section>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const svg = document.querySelector('svg');
  const lessonButtons = [...document.querySelectorAll('[data-task]')];
  const toolButtons = [...document.querySelectorAll('[data-mode]')];

  const example = {
    nodes: { A: [85, 210], B: [225, 95], C: [225, 320], D: [430, 195], E: [555, 195], F: [390, 65] },
    edges: ['A:B', 'A:C', 'B:D', 'C:D', 'D:E', 'B:F', 'D:F'],
    start: 'A', goal: 'E', next: 6
  };

  const lessons = {
    paths: {
      title: 'Zwei Wege vergleichen',
      instruction: 'Markiert im Beispielgraphen zwei verschiedene Wege von A nach E und merkt beide. Vergleicht ihre Kantenzahlen. Baut danach einen eigenen Graphen mit zwei unterschiedlich langen Wegen und prüft, welcher Weg kürzest ist.',
      prompt: 'Welche Wege habt ihr verglichen? Nennt die Knotenfolgen und erklärt, woran ihr einen kürzesten Weg erkennt.',
      mode: 'walk'
    },
    trials: {
      title: 'Die Wirkung einer neuen Kante testen',
      instruction: 'Speichert einen Graphen mit einem Weg von Start zu Ziel. Wählt zwei unverbundene Knoten und gebt vor dem Einfügen eure Vermutung ab. Ladet danach denselben Ausgangsgraphen. Findet eine Kante, die den Weg verkürzt, und eine, die seine Länge unverändert lässt.',
      prompt: 'Warum hat eine der beiden Kanten den kürzesten Weg verkürzt? Warum blieb er beim anderen Versuch gleich lang?',
      mode: 'predict'
    },
    trees: {
      title: 'Zwei Spannbäume konstruieren',
      instruction: 'Speichert einen zusammenhängenden Graphen mit Kreisen. Entfernt Kanten und prüft euren Spannbaum. Ladet danach denselben Ausgangsgraphen und findet einen anderen Spannbaum.',
      prompt: 'Begründet für beide Lösungen, warum alle Knoten verbunden sind und warum kein Kreis vorhanden ist.',
      mode: 'cut'
    }
  };

  const hints = {
    walk: 'Klickt nacheinander auf direkt verbundene Nachbarknoten.',
    add: 'Klickt auf eine freie Stelle, um einen Knoten zu setzen.',
    move: 'Wählt einen Knoten und klickt auf seine neue Position.',
    connect: 'Wählt die beiden Endknoten der neuen Kante.',
    cut: 'Wählt die beiden Endknoten der Kante, die ihr entfernen möchtet.',
    delete: 'Wählt den Knoten, den ihr samt seinen Kanten entfernen möchtet.',
    start: 'Wählt den neuen Startknoten.',
    goal: 'Wählt den neuen Zielknoten.',
    predict: 'Wählt zwei bisher unverbundene Knoten und gebt eure Vermutung ab.'
  };

  const clone = value => structuredClone(value);
  const pair = (a, b) => [a, b].sort().join(':');
  const edgeName = edge => edge.replace(':', '–');
  const palette = ['#21665d', '#914517', '#6247a3', '#943554', '#245e9c', '#606911'];
  const history = [];
  const notes = {};
  const comparisons = [];
  const attempts = [];
  const trees = [];

  let graph = clone(example);
  let baseline = null;
  let baselineId = 0;
  let lesson = 'paths';
  let mode = 'walk';
  let selection = [];
  let path = ['A'];
  let showGroups = false;
  let showCycle = false;

  function analyze(g) {
    const neighbors = Object.fromEntries(Object.keys(g.nodes).map(name => [name, []]));
    for (const edge of g.edges) {
      const [a, b] = edge.split(':');
      neighbors[a].push(b);
      neighbors[b].push(a);
    }

    const groups = new Map();
    const parents = new Map();
    let count = 0;
    let cycle = [];

    function visit(node, parent) {
      groups.set(node, count);
      parents.set(node, parent);
      for (const next of neighbors[node]) {
        if (!groups.has(next)) {
          visit(next, node);
        } else if (next !== parent && cycle.length === 0) {
          const chain = [node];
          while (chain.at(-1) !== next && parents.get(chain.at(-1))) {
            chain.push(parents.get(chain.at(-1)));
          }
          if (chain.at(-1) === next) {
            cycle = chain.slice(1).map((name, index) => pair(name, chain[index]));
            cycle.push(pair(node, next));
          }
        }
      }
    }

    for (const node of Object.keys(neighbors)) {
      if (groups.has(node)) continue;
      count++;
      visit(node, null);
    }

    const distances = new Map();
    if (g.start) {
      const queue = [g.start];
      distances.set(g.start, 0);
      for (const node of queue) {
        for (const next of neighbors[node]) {
          if (distances.has(next)) continue;
          distances.set(next, distances.get(node) + 1);
          queue.push(next);
        }
      }
    }

    return { groups, count, cycle, distance: distances.get(g.goal) };
  }

  function graphKey(g) {
    return JSON.stringify([Object.keys(g.nodes).sort(), [...g.edges].sort(), g.start, g.goal]);
  }

  function say(text) { $('feedback').textContent = text; }
  function resetPath() { path = graph.start ? [graph.start] : []; }
  function remember() { history.push({ graph: clone(graph), path: [...path] }); }

  function change(action, message) {
    remember();
    action();
    selection = [];
    $('guess').value = '';
    resetPath();
    render();
    say(message);
  }

  function pathText(nodes) {
    const length = nodes.length - 1;
    return nodes.join(' → ') + ' · ' + length + (length === 1 ? ' Kante' : ' Kanten');
  }

  function trialText(trial) {
    const guess = trial.guess === 'shorter' ? 'kürzer' : 'gleich lang';
    return 'Ausgangsgraph ' + trial.source + ' · Kante ' + edgeName(trial.edge)
      + ' · Vermutung: ' + guess + ' · Vorher ' + trial.before + ', nachher ' + trial.after + ' Kanten';
  }

  function treeText(tree) {
    return 'Ausgangsgraph ' + tree.source + ' · Baumkanten: ' + tree.edges.map(edgeName).join(', ');
  }

  function displayList(id, entries) {
    $(id).replaceChildren(...entries.map(entry => {
      const item = document.createElement('li');
      item.textContent = entry;
      return item;
    }));
  }

  function render() {
    const info = analyze(graph);
    const pathEdges = new Set(path.slice(1).map((name, index) => pair(path[index], name)));
    const latestTrial = attempts.at(-1);

    svg.replaceChildren();
    for (const edge of graph.edges) {
      const [a, b] = edge.split(':');
      const [x1, y1] = graph.nodes[a];
      const [x2, y2] = graph.nodes[b];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      for (const [attribute, value] of Object.entries({ x1, y1, x2, y2 })) {
        line.setAttribute(attribute, value);
      }
      line.classList.toggle('route', lesson === 'paths' && pathEdges.has(edge));
      line.classList.toggle('cycle', showCycle && info.cycle.includes(edge));
      line.classList.toggle('trial', lesson === 'trials' && latestTrial?.edge === edge
        && latestTrial.source === baselineId && !baseline.edges.includes(edge));
      svg.append(line);
    }

    const container = $('nodes');
    const buttons = new Map([...container.children].map(button => [button.textContent, button]));
    for (const [name, button] of buttons) {
      if (!Object.hasOwn(graph.nodes, name)) button.remove();
    }

    for (const [name, [x, y]] of Object.entries(graph.nodes)) {
      let button = buttons.get(name);
      if (!button) {
        button = document.createElement('button');
        button.type = 'button';
        button.className = 'node';
        button.textContent = name;
        button.addEventListener('click', event => {
          event.stopPropagation();
          selectNode(name);
        });
        container.append(button);
      }
      const group = info.groups.get(name);
      const role = name === graph.start ? ', Start' : name === graph.goal ? ', Ziel' : '';
      button.style.left = x / 640 * 100 + '%';
      button.style.top = y / 420 * 100 + '%';
      button.style.setProperty('--component', palette[(group - 1) % palette.length]);
      button.classList.toggle('start', name === graph.start);
      button.classList.toggle('goal', name === graph.goal);
      button.classList.toggle('component', showGroups);
      button.classList.toggle('visited', lesson === 'paths' && path.includes(name));
      button.classList.toggle('current', mode === 'walk' && path.at(-1) === name);
      button.classList.toggle('selected', selection.includes(name));
      button.setAttribute('aria-label', 'Knoten ' + name + role + (showGroups ? ', Komponente ' + group : ''));
    }

    const size = Object.keys(graph.nodes).length + ' Knoten · ' + graph.edges.length + ' Kanten';
    $('summary').textContent = size + ' · Start: ' + (graph.start ?? 'offen')
      + ' · Ziel: ' + (graph.goal ?? 'offen')
      + (lesson === 'paths' && path.length ? ' · Weg: ' + pathText(path) : '')
      + (lesson === 'trees'
        ? ' · ' + (info.count === 1 ? 'zusammenhängend' : info.count + ' Komponenten')
          + ' · ' + (info.cycle.length ? 'mit Kreis' : 'kreisfrei')
        : '');

    $('hint').textContent = hints[mode];
    $('canvas').classList.toggle('placing', mode === 'add' || mode === 'move');
    $('undo').disabled = history.length === 0 && selection.length === 0;
    $('restore').disabled = !baseline;
    $('restore').textContent = baseline ? 'Ausgangsgraph ' + baselineId + ' laden' : 'Ausgangsgraph laden';
    $('components').setAttribute('aria-pressed', String(showGroups));
    $('cycle').setAttribute('aria-pressed', String(showCycle));

    toolButtons.forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    });

    $('candidate').textContent = mode === 'predict' && selection.length === 2
      ? 'Gewählte Kante: ' + selection.join('–')
      : 'Wählt zwei bisher unverbundene Knoten für die neue Kante.';
    $('test').disabled = mode !== 'predict' || selection.length !== 2 || !$('guess').value;

    const current = comparisons.filter(entry => entry.graph === graphKey(graph));
    displayList('path-results', current.map(entry => pathText(entry.path)));

    const difference = current.length === 2 ? Math.abs(current[0].path.length - current[1].path.length) : 0;
    $('comparison').textContent = current.length !== 2 ? ''
      : difference === 0 ? 'Beide Wege sind gleich lang.'
      : 'Unterschied: ' + difference + (difference === 1 ? ' Kante.' : ' Kanten.');

    displayList('trial-results', attempts.map(trialText));
    displayList('tree-results', trees.map(treeText));
  }

  function setMode(next) {
    mode = next;
    selection = [];
    $('guess').value = '';
    render();
    say(hints[mode]);
  }

  function selectNode(name) {
    if (mode === 'walk') {
      const last = path.at(-1);
      if (!graph.start) return say('Legt zuerst einen Start fest.');
      if (graph.goal && last === graph.goal) return say('Ihr seid am Ziel. Prüft den Weg oder beginnt einen neuen.');
      if (!graph.edges.includes(pair(last, name))) return say('Wählt einen direkt verbundenen Nachbarknoten.');
      if (path.includes(name)) return say('Dieser Knoten liegt bereits auf eurem Weg. Nutzt bei Bedarf „Rückgängig“.');
      remember();
      path.push(name);
      render();
      return say(name === graph.goal ? 'Ziel erreicht. Prüft oder merkt den Weg.' : 'Wählt den nächsten Knoten.');
    }

    if (mode === 'start' || mode === 'goal') {
      const other = mode === 'start' ? 'goal' : 'start';
      if (graph[other] === name) return say('Wählt unterschiedliche Knoten für Start und Ziel.');
      const label = mode === 'start' ? 'Start' : 'Ziel';
      return change(() => { graph[mode] = name; }, label + ' ist jetzt ' + name + '.');
    }

    if (mode === 'delete') {
      return change(() => {
        delete graph.nodes[name];
        graph.edges = graph.edges.filter(edge => !edge.split(':').includes(name));
        if (graph.start === name) graph.start = null;
        if (graph.goal === name) graph.goal = null;
      }, 'Knoten ' + name + ' und seine Kanten wurden entfernt.');
    }

    if (mode === 'add') return say('Wählt eine freie Stelle auf der Zeichenfläche.');
    if (mode === 'move') {
      selection = [name];
      render();
      return say('Klickt auf die neue Position für ' + name + '.');
    }

    if (selection.length !== 1) {
      selection = [name];
      $('guess').value = '';
      render();
      return say('Wählt den zweiten Endknoten.');
    }

    const first = selection[0];
    if (first === name) return say('Wählt einen anderen Knoten.');
    const edge = pair(first, name);
    const exists = graph.edges.includes(edge);
    if (mode === 'cut' && !exists) return say('Zwischen diesen Knoten liegt keine Kante.');
    if (mode !== 'cut' && exists) return say('Diese Kante gibt es bereits.');

    if (mode === 'predict') {
      selection.push(name);
      render();
      return say('Gebt eure Vermutung ab, bevor ihr die Kante einfügt.');
    }

    const removing = mode === 'cut';
    change(() => {
      if (removing) graph.edges = graph.edges.filter(value => value !== edge);
      else graph.edges.push(edge);
    }, 'Kante ' + edgeName(edge) + (removing ? ' entfernt.' : ' gesetzt.'));
  }

  $('canvas').addEventListener('click', event => {
    if (mode !== 'add' && (mode !== 'move' || !selection.length)) return;
    const rect = $('canvas').getBoundingClientRect();
    const clamp = (value, min, max) => Math.max(min, Math.min(value, max));
    const x = clamp(event.clientX - rect.left, 24, rect.width - 24) / rect.width * 640;
    const y = clamp(event.clientY - rect.top, 24, rect.height - 24) / rect.height * 420;

    if (mode === 'move') {
      const name = selection[0];
      return change(() => { graph.nodes[name] = [x, y]; }, 'Knoten ' + name + ' verschoben.');
    }

    if (Object.keys(graph.nodes).length >= 24) return say('Ihr könnt bis zu 24 Knoten setzen.');
    const number = graph.next;
    const name = number < 26 ? String.fromCharCode(65 + number) : 'K' + (number + 1);
    change(() => {
      graph.next++;
      graph.nodes[name] = [x, y];
    }, 'Knoten ' + name + ' gesetzt.');
  });

  function openLesson(next) {
    notes[lesson] = $('notes').value;
    lesson = next;
    const activity = lessons[lesson];
    $('task-title').textContent = activity.title;
    $('instructions').textContent = activity.instruction;
    $('notes').value = notes[lesson] ?? '';
    $('notes').placeholder = activity.prompt;

    lessonButtons.forEach(button => {
      const active = button.dataset.task === lesson;
      button.setAttribute('aria-pressed', String(active));
      $(button.dataset.task).hidden = !active;
    });

    setMode(activity.mode);
  }

  lessonButtons.forEach(button => button.addEventListener('click', () => openLesson(button.dataset.task)));
  toolButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));

  $('undo').addEventListener('click', () => {
    if (selection.length) selection = [];
    else if (history.length) ({ graph, path } = history.pop());
    $('guess').value = '';
    render();
    say('Letzte Auswahl oder Änderung am Graphen rückgängig gemacht.');
  });

  $('baseline').addEventListener('click', () => {
    if (!Object.keys(graph.nodes).length) return say('Setzt zuerst Knoten für euren Ausgangsgraphen.');
    baseline = clone(graph);
    baselineId++;
    render();
    say('Ausgangsgraph ' + baselineId + ' gespeichert.');
  });

  $('restore').addEventListener('click', () => {
    if (!baseline) return;
    mode = lessons[lesson].mode;
    change(() => { graph = clone(baseline); }, 'Ausgangsgraph ' + baselineId + ' geladen.');
  });

  $('example').addEventListener('click', () => {
    mode = lessons[lesson].mode;
    change(() => { graph = clone(example); }, 'Beispielgraph geladen.');
  });

  $('empty').addEventListener('click', () => {
    mode = 'add';
    change(() => {
      graph = { nodes: {}, edges: [], start: null, goal: null, next: 0 };
    }, 'Setzt eure eigenen Knoten auf die Zeichenfläche.');
  });

  $('distance').addEventListener('click', () => {
    if (!graph.start || !graph.goal) return say('Legt zuerst Start und Ziel fest.');
    const distance = analyze(graph).distance;
    say(distance === undefined
      ? 'Zwischen Start und Ziel gibt es keinen Weg.'
      : 'Kürzeste Weglänge von ' + graph.start + ' nach ' + graph.goal + ': '
        + distance + (distance === 1 ? ' Kante.' : ' Kanten.'));
  });

  $('components').addEventListener('click', () => {
    showGroups = !showGroups;
    render();
    const { count, groups } = analyze(graph);
    const names = Array.from({ length: count }, (_, index) => {
      const members = [...groups].filter(([, value]) => value === index + 1).map(([name]) => name);
      return 'Gruppe ' + (index + 1) + ': ' + members.join(', ');
    });
    say(showGroups ? (count ? names.join(' · ') : 'Der Graph ist leer.') : 'Komponentenmarkierung ausgeblendet.');
  });

  $('cycle').addEventListener('click', () => {
    showCycle = !showCycle;
    render();
    const { cycle } = analyze(graph);
    say(showCycle
      ? (cycle.length ? 'Ein Kreis ist gestrichelt markiert: ' + cycle.map(edgeName).join(', ') + '.' : 'Der Graph ist kreisfrei.')
      : 'Kreismarkierung ausgeblendet.');
  });

  $('new-path').addEventListener('click', () => {
    if (path.length > 1) remember();
    resetPath();
    setMode('walk');
  });

  $('check-path').addEventListener('click', () => {
    if (!graph.start || !graph.goal || path.at(-1) !== graph.goal) {
      return say('Wählt einen vollständigen Weg vom Start bis zum Ziel.');
    }
    say(path.length - 1 === analyze(graph).distance
      ? 'Ihr habt einen kürzesten Weg gefunden.'
      : 'Euer Weg ist gültig. Es gibt einen Weg mit weniger Kanten.');
  });

  $('save-path').addEventListener('click', () => {
    if (!graph.start || !graph.goal || path.at(-1) !== graph.goal) return say('Erreicht zuerst das Ziel.');
    const key = graphKey(graph);
    const current = comparisons.filter(entry => entry.graph === key);

    if (current.some(entry => entry.path.join(':') === path.join(':'))) {
      return say('Diesen Weg habt ihr bereits gemerkt.');
    }
    if (current.length === 2) comparisons.splice(comparisons.indexOf(current[0]), 1);
    comparisons.push({ graph: key, path: [...path] });
    render();
    say('Weg gemerkt. Vergleicht die Längen oder wählt einen neuen Weg.');
  });

  $('predict').addEventListener('click', () => setMode('predict'));
  $('guess').addEventListener('change', render);

  $('test').addEventListener('click', () => {
    if (mode !== 'predict' || selection.length !== 2 || !$('guess').value) return;
    if (!baseline || graphKey(graph) !== graphKey(baseline)) {
      return say('Speichert zuerst euren Ausgangsgraphen oder ladet ihn für den nächsten Versuch.');
    }

    const before = analyze(graph).distance;
    if (before === undefined) return say('Der Ausgangsgraph braucht einen Weg zwischen Start und Ziel.');

    const edge = pair(...selection);
    const guess = $('guess').value;
    remember();
    graph.edges.push(edge);
    resetPath();
    selection = [];
    $('guess').value = '';

    const after = analyze(graph).distance;
    attempts.push({ edge, guess, before, after, source: baselineId });
    render();

    const correct = (after < before) === (guess === 'shorter');
    say((correct ? 'Eure Vermutung stimmt.' : 'Das Ergebnis weicht von eurer Vermutung ab.')
      + ' Vorher ' + before + ', nachher ' + after + ' Kanten. Die neue Kante ist blau markiert.');
  });

  $('save-tree').addEventListener('click', () => {
    if (!baseline || analyze(baseline).count !== 1) {
      return say('Speichert zuerst einen zusammenhängenden Ausgangsgraphen.');
    }
    if (!analyze(baseline).cycle.length) {
      return say('Wählt einen Ausgangsgraphen mit einem Kreis, damit verschiedene Spannbäume möglich sind.');
    }

    const sameNodes = Object.keys(graph.nodes).sort().join(':') === Object.keys(baseline.nodes).sort().join(':');
    if (!sameNodes || graph.edges.some(edge => !baseline.edges.includes(edge))) {
      return say('Ein Spannbaum enthält alle Knoten und nur Kanten des Ausgangsgraphen.');
    }

    const info = analyze(graph);
    if (info.count !== 1) return say('Der Graph ist getrennt. Macht das Entfernen einer Kante rückgängig.');
    if (info.cycle.length) return say('Alle Knoten sind verbunden. Der Graph enthält noch einen Kreis.');

    const edges = [...graph.edges].sort();
    const sameSource = trees.filter(tree => tree.source === baselineId);
    if (sameSource.some(tree => tree.edges.join() === edges.join())) {
      return say('Diesen Spannbaum habt ihr schon gemerkt. Wählt eine andere Kantenkombination.');
    }

    trees.push({ source: baselineId, edges });
    render();
    say(sameSource.length
      ? 'Ihr habt zwei verschiedene Spannbäume aus demselben Ausgangsgraphen gefunden. Begründet beide Lösungen.'
      : 'Erster Spannbaum gemerkt. Ladet denselben Ausgangsgraphen und sucht einen anderen.');
  });

  $('download').addEventListener('click', () => {
    notes[lesson] = $('notes').value;
    const blocks = [
      ['Wegevergleich', ...comparisons.map(entry => pathText(entry.path)), notes.paths],
      ['Kantenversuche', ...attempts.map(trialText), notes.trials],
      ['Spannbäume', ...trees.map(treeText), notes.trees]
    ];
    const text = 'Versuchsprotokoll – Graphenlabor\n\n'
      + blocks.map(block => block.filter(Boolean).join('\n')).join('\n\n');
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Versuchsprotokoll-Graphenlabor.txt';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  openLesson('paths');
</script>
</body>
</html>
